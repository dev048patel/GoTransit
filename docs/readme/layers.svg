<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" role="img" aria-label="Three layers: views draw, controllers hold logic, models own the data">
<title>Three layers: views draw, controllers hold logic, models own the data</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.cap{font-size:9px;letter-spacing:1.4px;font-weight:700}
.dim{fill:#7a818c}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.run{animation:run 7s linear infinite}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(var(--d,300px))}}
.flow{animation:flow 2.6s linear infinite}
@keyframes flow{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(var(--d,60px));opacity:0}}
.rise{transform-box:fill-box;transform-origin:left;animation:rise 3s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes rise{0%{transform:scaleX(.1)}45%,85%{transform:scaleX(1)}100%{transform:scaleX(.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".035"/><stop offset=".35" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
</defs>
<rect width="420" height="300" rx="12" fill="#0b0c0e"/><rect x="1" y="1" width="418" height="298" rx="11" fill="#101215" stroke="#23272e"/><rect x="1" y="1" width="418" height="298" rx="11" fill="url(#sheen)"/><rect x="1" y="24" width="2" height="252" fill="#38bdf8" opacity=".55"/>
<rect x="18" y="18" width="62.6" height="14" rx="3" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".8"/><text x="25" y="28" font-size="7.5" font-weight="700" fill="#38bdf8" letter-spacing=".3">THE LAYERS</text><text x="88.64999999999999" y="28" class="cap dim" font-size="7.5">MODEL · VIEW · CONTROLLER</text><text x="18" y="58" font-size="14" font-weight="700" fill="#e8e8e8">Three layers, one direction</text><text x="18" y="76" font-size="10" class="dim">screens only draw. logic lives in hooks. data has one home.</text><rect x="18" y="96" width="384" height="50" rx="8" fill="#38bdf8" fill-opacity=".06" stroke="#38bdf8" stroke-opacity=".7"/><text x="30" y="114" class="cap" fill="#38bdf8">VIEWS</text><text x="30" y="128" font-size="9.5" fill="#e8e8e8">pages and panels that only draw the screen</text><text x="30" y="140" font-size="8.5" class="dim">map · panels · auth · landing · admin</text><line x1="210" y1="146" x2="210" y2="158" stroke="#3a3f47" stroke-width="1.4"/><path d="M206 153 L210 158 L214 153" fill="none" stroke="#3a3f47" stroke-width="1.4"/><rect x="18" y="158" width="384" height="50" rx="8" fill="#f5a524" fill-opacity=".06" stroke="#f5a524" stroke-opacity=".7"/><text x="30" y="176" class="cap" fill="#f5a524">CONTROLLERS</text><text x="30" y="190" font-size="9.5" fill="#e8e8e8">hooks that hold each screen&#39;s state and logic</text><text x="30" y="202" font-size="8.5" class="dim">useMapController · useTripPlannerController</text><line x1="210" y1="208" x2="210" y2="220" stroke="#3a3f47" stroke-width="1.4"/><path d="M206 215 L210 220 L214 215" fill="none" stroke="#3a3f47" stroke-width="1.4"/><rect x="18" y="220" width="384" height="50" rx="8" fill="#4ade80" fill-opacity=".06" stroke="#4ade80" stroke-opacity=".7"/><text x="30" y="238" class="cap" fill="#4ade80">MODELS</text><text x="30" y="252" font-size="9.5" fill="#e8e8e8">services, data types and the database client</text><text x="30" y="264" font-size="8.5" class="dim">trip planning · live buses · auth · weather</text><text x="18" y="284" font-size="8.5" class="dim">a tap goes down the stack · the answer comes back up</text>
</svg>

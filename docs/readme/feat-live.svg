<svg xmlns="http://www.w3.org/2000/svg" width="420" height="236" viewBox="0 0 420 236" role="img" aria-label="Every bus, as it moves">
<title>Every bus, as it moves</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.cap{font-size:9px;letter-spacing:1.4px;font-weight:700}
.dim{fill:#7a818c}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.run{animation:run 7s linear infinite}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(var(--d,300px))}}
.flow{animation:flow 2.6s linear infinite}
@keyframes flow{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(var(--d,60px));opacity:0}}
.rise{transform-box:fill-box;transform-origin:left;animation:rise 3s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes rise{0%{transform:scaleX(.1)}45%,85%{transform:scaleX(1)}100%{transform:scaleX(.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".035"/><stop offset=".35" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
</defs>
<rect width="420" height="236" rx="12" fill="#0b0c0e"/><rect x="1" y="1" width="418" height="234" rx="11" fill="#101215" stroke="#23272e"/><rect x="1" y="1" width="418" height="234" rx="11" fill="url(#sheen)"/><rect x="1" y="24" width="2" height="188" fill="#f5a524" opacity=".55"/><text x="406" y="226" text-anchor="end" font-size="64" font-weight="800" fill="#fff" opacity=".035">01</text>
<rect x="18" y="18" width="62.6" height="14" rx="3" fill="#f5a524" fill-opacity=".12" stroke="#f5a524" stroke-opacity=".8"/><text x="25" y="28" font-size="7.5" font-weight="700" fill="#f5a524" letter-spacing=".3">FEATURE 01</text><text x="88.64999999999999" y="28" class="cap dim" font-size="7.5">LIVE MAP</text><rect x="367.5" y="15" width="34.5" height="18" rx="4" fill="#f5a524" fill-opacity=".1" stroke="#f5a524"/><text x="384.8" y="28" text-anchor="middle" font-size="8.5" font-weight="700" fill="#f5a524">live</text><text x="18" y="58" font-size="14" font-weight="700" fill="#e8e8e8">Every bus, as it moves</text><text x="18" y="76" font-size="10" class="dim">positions refresh every 1.5 seconds, coloured by route</text><g opacity=".9"><line x1="18" y1="110" x2="402" y2="110" stroke="#3a3f47" stroke-width=".6"/><line x1="18" y1="140" x2="402" y2="140" stroke="#3a3f47" stroke-width=".6"/><line x1="18" y1="170" x2="402" y2="170" stroke="#3a3f47" stroke-width=".6"/><line x1="18" y1="200" x2="402" y2="200" stroke="#3a3f47" stroke-width=".6"/><line x1="60" y1="96" x2="60" y2="214" stroke="#3a3f47" stroke-width=".6"/><line x1="130" y1="96" x2="130" y2="214" stroke="#3a3f47" stroke-width=".6"/><line x1="200" y1="96" x2="200" y2="214" stroke="#3a3f47" stroke-width=".6"/><line x1="270" y1="96" x2="270" y2="214" stroke="#3a3f47" stroke-width=".6"/><line x1="340" y1="96" x2="340" y2="214" stroke="#3a3f47" stroke-width=".6"/></g><path d="M18 170 H200 V110 H402" fill="none" stroke="#f5a524" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><path d="M60 214 V140 H340 V96" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><g class="run" style="--d:150px;animation-duration:6s"><rect x="22" y="163" width="24" height="14" rx="4" fill="#f5a524" stroke="#101215" stroke-width="1.5"/><text x="34" y="173.5" text-anchor="middle" font-size="8" font-weight="800" fill="#101215">4</text></g><g class="run" style="--d:160px;animation-duration:7s"><rect x="210" y="103" width="24" height="14" rx="4" fill="#f5a524" stroke="#101215" stroke-width="1.5"/><text x="222" y="113.5" text-anchor="middle" font-size="8" font-weight="800" fill="#101215">4</text></g><g class="run" style="--d:240px;animation-duration:9s"><rect x="70" y="133" width="24" height="14" rx="4" fill="#38bdf8" stroke="#101215" stroke-width="1.5"/><text x="82" y="143.5" text-anchor="middle" font-size="8" font-weight="800" fill="#101215">18</text></g><circle cx="200" cy="140" r="16" fill="#4ade80" opacity=".12"/><circle cx="200" cy="140" r="5" fill="#4ade80" stroke="#101215" stroke-width="1.5" class="pulse"/>
</svg>

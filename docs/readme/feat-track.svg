<svg xmlns="http://www.w3.org/2000/svg" width="420" height="236" viewBox="0 0 420 236" role="img" aria-label="Never guess mid-trip">
<title>Never guess mid-trip</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.cap{font-size:9px;letter-spacing:1.4px;font-weight:700}
.dim{fill:#7a818c}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.run{animation:run 7s linear infinite}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(var(--d,300px))}}
.flow{animation:flow 2.6s linear infinite}
@keyframes flow{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(var(--d,60px));opacity:0}}
.rise{transform-box:fill-box;transform-origin:left;animation:rise 3s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes rise{0%{transform:scaleX(.1)}45%,85%{transform:scaleX(1)}100%{transform:scaleX(.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".035"/><stop offset=".35" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
</defs>
<rect width="420" height="236" rx="12" fill="#0b0c0e"/><rect x="1" y="1" width="418" height="234" rx="11" fill="#101215" stroke="#23272e"/><rect x="1" y="1" width="418" height="234" rx="11" fill="url(#sheen)"/><rect x="1" y="24" width="2" height="188" fill="#4ade80" opacity=".55"/><text x="406" y="226" text-anchor="end" font-size="64" font-weight="800" fill="#fff" opacity=".035">05</text>
<rect x="18" y="18" width="62.6" height="14" rx="3" fill="#4ade80" fill-opacity=".12" stroke="#4ade80" stroke-opacity=".8"/><text x="25" y="28" font-size="7.5" font-weight="700" fill="#4ade80" letter-spacing=".3">FEATURE 05</text><text x="88.64999999999999" y="28" class="cap dim" font-size="7.5">TRIP TRACKING</text><rect x="367.5" y="15" width="34.5" height="18" rx="4" fill="#4ade80" fill-opacity=".1" stroke="#4ade80"/><text x="384.8" y="28" text-anchor="middle" font-size="8.5" font-weight="700" fill="#4ade80">live</text><text x="18" y="58" font-size="14" font-weight="700" fill="#e8e8e8">Never guess mid-trip</text><text x="18" y="76" font-size="10" class="dim">one line tells you what to do right now</text><rect x="18" y="98" width="384" height="34" rx="8" fill="#4ade80" fill-opacity=".08" stroke="#4ade80" stroke-opacity=".6"/><circle cx="32" cy="115" r="4" fill="#4ade80" class="pulse"/><text x="44" y="112" font-size="10" font-weight="700" fill="#e8e8e8">Walk 324 m to University Dr W</text><text x="44" y="125" font-size="9" fill="#4ade80" font-weight="700">bus in ~3 min · 1.2 km away</text><line x1="74" y1="150" x2="74" y2="216" stroke="#3a3f47" stroke-width="2"/><line x1="74" y1="172" x2="74" y2="194" stroke="#f5a524" stroke-width="3"/><text x="62" y="153.5" text-anchor="end" font-size="8.5" font-weight="700" fill="#e8e8e8">2:50 PM</text><circle cx="74" cy="150" r="4.5" fill="#101215" stroke="#4285F4" stroke-width="2"/><text x="88" y="153.5" font-size="10" fill="#e8e8e8">Your location</text><text x="62" y="175.5" text-anchor="end" font-size="8.5" font-weight="700" fill="#e8e8e8">2:55 PM</text><circle cx="74" cy="172" r="4.5" fill="#101215" stroke="#f5a524" stroke-width="2"/><text x="88" y="175.5" font-size="10" fill="#e8e8e8">Board Route 3</text><text x="62" y="197.5" text-anchor="end" font-size="8.5" font-weight="700" fill="#e8e8e8"></text><circle cx="74" cy="194" r="4.5" fill="#101215" stroke="#ef4444" stroke-width="2"/><text x="88" y="197.5" font-size="10" fill="#e8e8e8">11th Ave @ Hamilton St · get off</text><text x="62" y="219.5" text-anchor="end" font-size="8.5" font-weight="700" fill="#e8e8e8">3:24 PM</text><circle cx="74" cy="216" r="4.5" fill="#101215" stroke="#4ade80" stroke-width="2"/><text x="88" y="219.5" font-size="10" fill="#e8e8e8">Arrive at destination</text>
</svg>

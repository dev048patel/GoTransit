<svg xmlns="http://www.w3.org/2000/svg" width="420" height="236" viewBox="0 0 420 236" role="img" aria-label="Your places, one tap away">
<title>Your places, one tap away</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.cap{font-size:9px;letter-spacing:1.4px;font-weight:700}
.dim{fill:#7a818c}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.run{animation:run 7s linear infinite}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(var(--d,300px))}}
.flow{animation:flow 2.6s linear infinite}
@keyframes flow{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(var(--d,60px));opacity:0}}
.rise{transform-box:fill-box;transform-origin:left;animation:rise 3s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes rise{0%{transform:scaleX(.1)}45%,85%{transform:scaleX(1)}100%{transform:scaleX(.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".035"/><stop offset=".35" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
</defs>
<rect width="420" height="236" rx="12" fill="#0b0c0e"/><rect x="1" y="1" width="418" height="234" rx="11" fill="#101215" stroke="#23272e"/><rect x="1" y="1" width="418" height="234" rx="11" fill="url(#sheen)"/><rect x="1" y="24" width="2" height="188" fill="#38bdf8" opacity=".55"/><text x="406" y="226" text-anchor="end" font-size="64" font-weight="800" fill="#fff" opacity=".035">06</text>
<rect x="18" y="18" width="62.6" height="14" rx="3" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".8"/><text x="25" y="28" font-size="7.5" font-weight="700" fill="#38bdf8" letter-spacing=".3">FEATURE 06</text><text x="88.64999999999999" y="28" class="cap dim" font-size="7.5">SAVED PLACES</text><rect x="367.5" y="15" width="34.5" height="18" rx="4" fill="#38bdf8" fill-opacity=".1" stroke="#38bdf8"/><text x="384.8" y="28" text-anchor="middle" font-size="8.5" font-weight="700" fill="#38bdf8">live</text><text x="18" y="58" font-size="14" font-weight="700" fill="#e8e8e8">Your places, one tap away</text><text x="18" y="76" font-size="10" class="dim">keep home, school and work ready to route</text><rect x="18" y="100" width="384" height="30" rx="6" fill="#ffffff" fill-opacity=".03" stroke="#23272e"/><path d="M30 108 h10 v15 l-5 -4 l-5 4 z" fill="#f5a524" fill-opacity=".25" stroke="#f5a524" stroke-width="1.4" stroke-linejoin="round"/><text x="52" y="114" font-size="10" font-weight="700" fill="#e8e8e8">Home</text><text x="52" y="125" font-size="8.5" class="dim">65 Munroe Place</text><text x="394" y="119" text-anchor="end" font-size="9" font-weight="700" fill="#f5a524">go ▸</text><rect x="18" y="138" width="384" height="30" rx="6" fill="#ffffff" fill-opacity=".03" stroke="#23272e"/><path d="M30 146 h10 v15 l-5 -4 l-5 4 z" fill="#38bdf8" fill-opacity=".25" stroke="#38bdf8" stroke-width="1.4" stroke-linejoin="round"/><text x="52" y="152" font-size="10" font-weight="700" fill="#e8e8e8">Study</text><text x="52" y="163" font-size="8.5" class="dim">University of Regina</text><text x="394" y="157" text-anchor="end" font-size="9" font-weight="700" fill="#38bdf8">go ▸</text><rect x="18" y="176" width="384" height="30" rx="6" fill="#ffffff" fill-opacity=".03" stroke="#23272e"/><path d="M30 184 h10 v15 l-5 -4 l-5 4 z" fill="#4ade80" fill-opacity=".25" stroke="#4ade80" stroke-width="1.4" stroke-linejoin="round"/><text x="52" y="190" font-size="10" font-weight="700" fill="#e8e8e8">Groceries</text><text x="52" y="201" font-size="8.5" class="dim">Albert Street</text><text x="394" y="195" text-anchor="end" font-size="9" font-weight="700" fill="#4ade80">go ▸</text><text x="18" y="225" font-size="8.5" class="dim">sign in once · your places follow you to any device</text>
</svg>

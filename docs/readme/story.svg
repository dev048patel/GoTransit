<svg xmlns="http://www.w3.org/2000/svg" width="840" height="236" viewBox="0 0 840 236" role="img" aria-label="Why we built it: a timetable says when the bus should come, riders need to know when it will">
<title>Why we built it: a timetable says when the bus should come, riders need to know when it will</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.cap{font-size:9px;letter-spacing:1.4px;font-weight:700}
.dim{fill:#7a818c}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.run{animation:run 7s linear infinite}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(var(--d,300px))}}
.flow{animation:flow 2.6s linear infinite}
@keyframes flow{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(var(--d,60px));opacity:0}}
.rise{transform-box:fill-box;transform-origin:left;animation:rise 3s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes rise{0%{transform:scaleX(.1)}45%,85%{transform:scaleX(1)}100%{transform:scaleX(.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".035"/><stop offset=".35" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
</defs>
<rect width="840" height="236" rx="12" fill="#0b0c0e"/><rect x="1" y="1" width="838" height="234" rx="11" fill="#101215" stroke="#23272e"/><rect x="1" y="1" width="838" height="234" rx="11" fill="url(#sheen)"/><rect x="1" y="24" width="2" height="188" fill="#f5a524" opacity=".55"/>
<rect x="26" y="18" width="87.0" height="14" rx="3" fill="#f5a524" fill-opacity=".12" stroke="#f5a524" stroke-opacity=".8"/><text x="33" y="28" font-size="7.5" font-weight="700" fill="#f5a524" letter-spacing=".3">WHY WE BUILT IT</text><text x="120.975" y="28" class="cap dim" font-size="7.5">THE TIMETABLE ONLY TELLS HALF THE STORY</text><text x="26" y="58" font-size="14" font-weight="700" fill="#e8e8e8">A timetable says when the bus should come. Riders need to know when it will.</text><text x="26" y="78" font-size="10.5" class="dim">so people pad every trip with waiting, or give up and drive. we ride these buses too, and we decided to take the first step.</text><rect x="26" y="98" width="372" height="112" rx="8" fill="#ffffff" fill-opacity=".02" stroke="#23272e"/><text x="40" y="118" class="cap dim">BEFORE · THE PRINTED TIMETABLE</text><text x="40" y="150" font-size="24" font-weight="800" fill="#7a818c">3:10 PM</text><text x="150" y="150" font-size="11" class="dim">scheduled</text><text x="40" y="172" font-size="10.5" class="dim">is it early? late? already gone?</text><text x="40" y="190" font-size="10.5" class="dim">you stand at the stop and find out.</text><line x1="406" y1="154" x2="432" y2="154" stroke="#f5a524" stroke-width="1.6"/><path d="M427 149 L433 154 L427 159" fill="none" stroke="#f5a524" stroke-width="1.6"/><rect x="442" y="98" width="372" height="112" rx="8" fill="#f5a524" fill-opacity=".05" stroke="#f5a524" stroke-opacity=".7"/><text x="456" y="118" class="cap" fill="#f5a524">NOW · TRANSIT REGINA</text><circle cx="462" cy="142" r="5" fill="#4ade80" class="pulse"/><text x="476" y="150" font-size="24" font-weight="800" fill="#e8e8e8">4 min</text><text x="562" y="150" font-size="11" fill="#4ade80" font-weight="700">live · bus is 1.2 km away</text><text x="456" y="172" font-size="10.5" fill="#e8e8e8">leave at the right minute. know your transfer.</text><text x="456" y="190" font-size="10.5" fill="#f5a524" font-weight="700">transit, used to your advantage.</text>
</svg>

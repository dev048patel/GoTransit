<svg xmlns="http://www.w3.org/2000/svg" width="420" height="236" viewBox="0 0 420 236" role="img" aria-label="Door to door, with transfers">
<title>Door to door, with transfers</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.cap{font-size:9px;letter-spacing:1.4px;font-weight:700}
.dim{fill:#7a818c}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.run{animation:run 7s linear infinite}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(var(--d,300px))}}
.flow{animation:flow 2.6s linear infinite}
@keyframes flow{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(var(--d,60px));opacity:0}}
.rise{transform-box:fill-box;transform-origin:left;animation:rise 3s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes rise{0%{transform:scaleX(.1)}45%,85%{transform:scaleX(1)}100%{transform:scaleX(.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".035"/><stop offset=".35" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
</defs>
<rect width="420" height="236" rx="12" fill="#0b0c0e"/><rect x="1" y="1" width="418" height="234" rx="11" fill="#101215" stroke="#23272e"/><rect x="1" y="1" width="418" height="234" rx="11" fill="url(#sheen)"/><rect x="1" y="24" width="2" height="188" fill="#38bdf8" opacity=".55"/><text x="406" y="226" text-anchor="end" font-size="64" font-weight="800" fill="#fff" opacity=".035">02</text>
<rect x="18" y="18" width="62.6" height="14" rx="3" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".8"/><text x="25" y="28" font-size="7.5" font-weight="700" fill="#38bdf8" letter-spacing=".3">FEATURE 02</text><text x="88.64999999999999" y="28" class="cap dim" font-size="7.5">TRIP PLANNER</text><rect x="367.5" y="15" width="34.5" height="18" rx="4" fill="#38bdf8" fill-opacity=".1" stroke="#38bdf8"/><text x="384.8" y="28" text-anchor="middle" font-size="8.5" font-weight="700" fill="#38bdf8">live</text><text x="18" y="58" font-size="14" font-weight="700" fill="#e8e8e8">Door to door, with transfers</text><text x="18" y="76" font-size="10" class="dim">search a place and get the fastest ways to reach it</text><line x1="74" y1="104" x2="74" y2="208" stroke="#3a3f47" stroke-width="2"/><line x1="74" y1="130" x2="74" y2="156" stroke="#f5a524" stroke-width="3"/><line x1="74" y1="182" x2="74" y2="208" stroke="#38bdf8" stroke-width="3"/><text x="62" y="107.5" text-anchor="end" font-size="8.5" font-weight="700" fill="#e8e8e8">2:50 PM</text><circle cx="74" cy="104" r="4.5" fill="#101215" stroke="#4ade80" stroke-width="2"/><text x="88" y="107.5" font-size="10" fill="#e8e8e8" font-weight="600">Walk 324 m</text><text x="62" y="133.5" text-anchor="end" font-size="8.5" font-weight="700" fill="#e8e8e8">2:55 PM</text><circle cx="74" cy="130" r="4.5" fill="#101215" stroke="#f5a524" stroke-width="2"/><text x="88" y="133.5" font-size="10" fill="#e8e8e8" font-weight="600">Route 3 · University – Sherwood</text><text x="62" y="159.5" text-anchor="end" font-size="8.5" font-weight="700" fill="#e8e8e8"></text><circle cx="74" cy="156" r="4.5" fill="#101215" stroke="#fb923c" stroke-width="2"/><text x="88" y="159.5" font-size="10" fill="#fb923c" font-weight="700">Transfer · wait ~5 min</text><text x="62" y="185.5" text-anchor="end" font-size="8.5" font-weight="700" fill="#e8e8e8">3:09 PM</text><circle cx="74" cy="182" r="4.5" fill="#101215" stroke="#38bdf8" stroke-width="2"/><text x="88" y="185.5" font-size="10" fill="#e8e8e8" font-weight="600">Route 7 · Glencairn – Whitmore</text><text x="62" y="211.5" text-anchor="end" font-size="8.5" font-weight="700" fill="#e8e8e8">3:24 PM</text><circle cx="74" cy="208" r="4.5" fill="#101215" stroke="#4ade80" stroke-width="2"/><text x="88" y="211.5" font-size="10" fill="#e8e8e8" font-weight="600">Arrive at destination</text><text x="402" y="108" text-anchor="end" font-size="16" font-weight="800" fill="#38bdf8">34 min</text><text x="402" y="122" text-anchor="end" font-size="8.5" class="dim">live prediction</text>
</svg>

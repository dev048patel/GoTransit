<svg xmlns="http://www.w3.org/2000/svg" width="420" height="152" viewBox="0 0 420 152" role="img" aria-label="Nirjar Patel — Co-Founder">
<title>Nirjar Patel — Co-Founder</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.cap{font-size:9px;letter-spacing:1.4px;font-weight:700}
.dim{fill:#7a818c}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.run{animation:run 7s linear infinite}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(var(--d,300px))}}
.flow{animation:flow 2.6s linear infinite}
@keyframes flow{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(var(--d,60px));opacity:0}}
.rise{transform-box:fill-box;transform-origin:left;animation:rise 3s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes rise{0%{transform:scaleX(.1)}45%,85%{transform:scaleX(1)}100%{transform:scaleX(.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".035"/><stop offset=".35" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
</defs>
<rect width="420" height="152" rx="12" fill="#0b0c0e"/><rect x="1" y="1" width="418" height="150" rx="11" fill="#101215" stroke="#23272e"/><rect x="1" y="1" width="418" height="150" rx="11" fill="url(#sheen)"/><rect x="1" y="24" width="2" height="104" fill="#38bdf8" opacity=".55"/><text x="406" y="142" text-anchor="end" font-size="64" font-weight="800" fill="#fff" opacity=".035">02</text>
<rect x="18" y="18" width="62.6" height="14" rx="3" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".8"/><text x="25" y="28" font-size="7.5" font-weight="700" fill="#38bdf8" letter-spacing=".3">BUILDER 02</text><text x="88.64999999999999" y="28" class="cap dim" font-size="7.5">CO-FOUNDER</text><circle cx="48" cy="84" r="26" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".8"/><text x="48" y="90" text-anchor="middle" font-size="16" font-weight="800" fill="#38bdf8">NP</text><text x="90" y="74" font-size="14" font-weight="700" fill="#e8e8e8">Nirjar Patel</text><text x="90" y="92" font-size="9.5" class="dim">frontend, architecture</text><text x="90" y="106" font-size="9.5" class="dim">and QA</text><rect x="18" y="124" width="139.7" height="14" rx="3" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".8"/><text x="25" y="134" font-size="8.5" font-weight="700" fill="#38bdf8" letter-spacing=".3">▸ github.com/nirjar1012</text>

<svg xmlns="http://www.w3.org/2000/svg" width="420" height="236" viewBox="0 0 420 236" role="img" aria-label="Next departures at any stop">
<title>Next departures at any stop</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.cap{font-size:9px;letter-spacing:1.4px;font-weight:700}
.dim{fill:#7a818c}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.run{animation:run 7s linear infinite}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(var(--d,300px))}}
.flow{animation:flow 2.6s linear infinite}
@keyframes flow{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(var(--d,60px));opacity:0}}
.rise{transform-box:fill-box;transform-origin:left;animation:rise 3s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes rise{0%{transform:scaleX(.1)}45%,85%{transform:scaleX(1)}100%{transform:scaleX(.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".035"/><stop offset=".35" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
</defs>
<rect width="420" height="236" rx="12" fill="#0b0c0e"/><rect x="1" y="1" width="418" height="234" rx="11" fill="#101215" stroke="#23272e"/><rect x="1" y="1" width="418" height="234" rx="11" fill="url(#sheen)"/><rect x="1" y="24" width="2" height="188" fill="#4ade80" opacity=".55"/><text x="406" y="226" text-anchor="end" font-size="64" font-weight="800" fill="#fff" opacity=".035">03</text>
<rect x="18" y="18" width="62.6" height="14" rx="3" fill="#4ade80" fill-opacity=".12" stroke="#4ade80" stroke-opacity=".8"/><text x="25" y="28" font-size="7.5" font-weight="700" fill="#4ade80" letter-spacing=".3">FEATURE 03</text><text x="88.64999999999999" y="28" class="cap dim" font-size="7.5">STOP BOARD</text><rect x="367.5" y="15" width="34.5" height="18" rx="4" fill="#4ade80" fill-opacity=".1" stroke="#4ade80"/><text x="384.8" y="28" text-anchor="middle" font-size="8.5" font-weight="700" fill="#4ade80">live</text><text x="18" y="58" font-size="14" font-weight="700" fill="#e8e8e8">Next departures at any stop</text><text x="18" y="76" font-size="10" class="dim">tap a stop to see what is coming and when</text><rect x="18" y="100" width="384" height="30" rx="6" fill="#ffffff" fill-opacity=".03" stroke="#23272e"/><rect x="26" y="107" width="34" height="16" rx="8" fill="#b91c1c"/><text x="43" y="118.5" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">60</text><text x="70" y="119" font-size="10" fill="#e8e8e8">Arcola Downtown</text><rect x="230" y="113" width="96" height="4" rx="2" fill="#3a3f47"/><rect x="230" y="113" width="96" height="4" rx="2" fill="#4ade80" class="rise" style="animation-delay:0.0s"/><text x="394" y="119" text-anchor="end" font-size="11" font-weight="800" fill="#e8e8e8">20 min</text><rect x="18" y="138" width="384" height="30" rx="6" fill="#ffffff" fill-opacity=".03" stroke="#23272e"/><rect x="26" y="145" width="34" height="16" rx="8" fill="#7f1d1d"/><text x="43" y="156.5" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">8</text><text x="70" y="157" font-size="10" fill="#e8e8e8">Normandy Heights</text><rect x="230" y="151" width="96" height="4" rx="2" fill="#3a3f47"/><rect x="230" y="151" width="75" height="4" rx="2" fill="#4ade80" class="rise" style="animation-delay:0.3s"/><text x="394" y="157" text-anchor="end" font-size="11" font-weight="800" fill="#e8e8e8">28 min</text><rect x="18" y="176" width="384" height="30" rx="6" fill="#ffffff" fill-opacity=".03" stroke="#23272e"/><rect x="26" y="183" width="34" height="16" rx="8" fill="#8b5cf6"/><text x="43" y="194.5" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">9</text><text x="70" y="195" font-size="10" fill="#e8e8e8">Albert Park</text><rect x="230" y="189" width="96" height="4" rx="2" fill="#3a3f47"/><rect x="230" y="189" width="71" height="4" rx="2" fill="#4ade80" class="rise" style="animation-delay:0.6s"/><text x="394" y="195" text-anchor="end" font-size="11" font-weight="800" fill="#e8e8e8">29 min</text><circle cx="24" cy="222" r="3" fill="#4ade80" class="pulse"/><text x="32" y="225" font-size="8.5" class="dim">live · auto-refreshing every 30s</text>
</svg>

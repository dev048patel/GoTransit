<svg xmlns="http://www.w3.org/2000/svg" width="840" height="262" viewBox="0 0 840 262" role="img" aria-label="A tap on the map runs through React, Express and Supabase">
<title>A tap on the map runs through React, Express and Supabase</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.cap{font-size:9px;letter-spacing:1.4px;font-weight:700}
.dim{fill:#7a818c}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.run{animation:run 7s linear infinite}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(var(--d,300px))}}
.flow{animation:flow 2.6s linear infinite}
@keyframes flow{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(var(--d,60px));opacity:0}}
.rise{transform-box:fill-box;transform-origin:left;animation:rise 3s cubic-bezier(.3,.7,.2,1) infinite}
@keyframes rise{0%{transform:scaleX(.1)}45%,85%{transform:scaleX(1)}100%{transform:scaleX(.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".035"/><stop offset=".35" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
</defs>
<rect width="840" height="262" rx="12" fill="#0b0c0e"/><rect x="1" y="1" width="838" height="260" rx="11" fill="#101215" stroke="#23272e"/><rect x="1" y="1" width="838" height="260" rx="11" fill="url(#sheen)"/><rect x="1" y="24" width="2" height="214" fill="#f5a524" opacity=".55"/>
<rect x="26" y="18" width="72.4" height="14" rx="3" fill="#f5a524" fill-opacity=".12" stroke="#f5a524" stroke-opacity=".8"/><text x="33" y="28" font-size="7.5" font-weight="700" fill="#f5a524" letter-spacing=".3">ARCHITECTURE</text><text x="106.38" y="28" class="cap dim" font-size="7.5">ONE TAP, END TO END</text><text x="26" y="58" font-size="14" font-weight="700" fill="#e8e8e8">A tap on the map runs through React, Express and Supabase</text><rect x="26" y="84" width="210" height="122" rx="8" fill="#38bdf8" fill-opacity=".06" stroke="#38bdf8" stroke-opacity=".7"/><text x="38" y="104" class="cap" fill="#38bdf8">BROWSER</text><text x="38" y="124" font-size="10" fill="#e8e8e8" font-weight="700">React 19 + TypeScript</text><text x="38" y="139" font-size="10" fill="#7a818c" font-weight="400">Vite 7 · Tailwind</text><text x="38" y="154" font-size="10" fill="#7a818c" font-weight="400">Google Maps</text><text x="38" y="169" font-size="10" fill="#7a818c" font-weight="400">Framer Motion</text><rect x="314" y="84" width="212" height="122" rx="8" fill="#f5a524" fill-opacity=".06" stroke="#f5a524" stroke-opacity=".7"/><text x="326" y="104" class="cap" fill="#f5a524">API SERVER</text><text x="326" y="124" font-size="10" fill="#e8e8e8" font-weight="700">Express 5 on Node</text><text x="326" y="139" font-size="10" fill="#7a818c" font-weight="400">/api/live  /api/stops</text><text x="326" y="154" font-size="10" fill="#7a818c" font-weight="400">/api/routes</text><text x="326" y="169" font-size="10" fill="#7a818c" font-weight="400">trip planning, SMS, push</text><rect x="604" y="84" width="210" height="54" rx="8" fill="#4ade80" fill-opacity=".06" stroke="#4ade80" stroke-opacity=".7"/><text x="616" y="104" class="cap" fill="#4ade80">SUPABASE</text><text x="616" y="124" font-size="10" fill="#e8e8e8" font-weight="700">Postgres + Auth</text><rect x="604" y="152" width="210" height="54" rx="8" fill="#ef4444" fill-opacity=".06" stroke="#ef4444" stroke-opacity=".7"/><text x="616" y="172" class="cap" fill="#ef4444">TRANSITLIVE FEED</text><text x="616" y="192" font-size="10" fill="#e8e8e8" font-weight="700">live bus positions</text><line x1="240" y1="145" x2="310" y2="145" stroke="#3a3f47" stroke-width="1.4"/><path d="M304 141 L310 145 L304 149" fill="none" stroke="#3a3f47" stroke-width="1.4"/><circle cx="240" cy="145" r="3" fill="#38bdf8" class="flow" style="--d:70px"/><text x="275.0" y="137" text-anchor="middle" font-size="8.5" class="dim">every 1.5s</text><line x1="530" y1="111" x2="600" y2="111" stroke="#3a3f47" stroke-width="1.4"/><path d="M594 107 L600 111 L594 115" fill="none" stroke="#3a3f47" stroke-width="1.4"/><circle cx="530" cy="111" r="3" fill="#4ade80" class="flow" style="--d:70px"/><line x1="530" y1="179" x2="600" y2="179" stroke="#3a3f47" stroke-width="1.4"/><path d="M594 175 L600 179 L594 183" fill="none" stroke="#3a3f47" stroke-width="1.4"/><circle cx="530" cy="179" r="3" fill="#ef4444" class="flow" style="--d:70px"/><rect x="26" y="226" width="194.4" height="14" rx="3" fill="#7a818c" fill-opacity=".12" stroke="#7a818c" stroke-opacity=".8"/><text x="33" y="236" font-size="8.5" font-weight="700" fill="#7a818c" letter-spacing=".3">mvc: models · controllers · views</text><rect x="228.411" y="226" width="112.4" height="14" rx="3" fill="#7a818c" fill-opacity=".12" stroke="#7a818c" stroke-opacity=".8"/><text x="235.411" y="236" font-size="8.5" font-weight="700" fill="#7a818c" letter-spacing=".3">frontend on vercel</text><rect x="348.817" y="226" width="90.5" height="14" rx="3" fill="#7a818c" fill-opacity=".12" stroke="#7a818c" stroke-opacity=".8"/><text x="355.817" y="236" font-size="8.5" font-weight="700" fill="#7a818c" letter-spacing=".3">api on railway</text>
</svg>
